```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>✊ Rock Paper Scissors ✋</h1>

        <p class="subtitle">Choose your move and beat the computer!</p>

        <div class="choices">
            <button onclick="playGame('rock')">✊ Rock</button>
            <button onclick="playGame('paper')">✋ Paper</button>
            <button onclick="playGame('scissors')">✌️ Scissors</button>
        </div>

        <div class="result-box">
            <p id="player-choice">Your choice: -</p>
            <p id="computer-choice">Computer's choice: -</p>
            <h2 id="result">Make your move!</h2>
        </div>

        <div class="scoreboard">
            <div class="score">
                <h3>You</h3>
                <p id="player-score">0</p>
            </div>

            <div class="score">
                <h3>Computer</h3>
                <p id="computer-score">0</p>
            </div>
        </div>

        <button class="reset-button" onclick="resetGame()">
            Reset Game
        </button>

        <footer>
            <p>Made with ❤️ using HTML, CSS and JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
